name: Update KCU academic calendar

on:
  schedule:
    # 학사일정은 연/학기 단위로 미리 확정 공고되므로 매일 조회할 이유가 없다.
    # 학기 전환처럼 실제로 갱신되는 시점을 일주일 안에 잡는 정도면 충분하다.
    - cron: '0 21 * * 0'  # 매주 월요일 06:00 KST (일요일 UTC 21:00)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'fetch_schedule.py'
      - 'requirements.txt'
      - '.github/workflows/update-calendar.yml'

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch schedule and build ICS
        run: python fetch_schedule.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- docs/kcu-schedule.ics docs/kcu-schedule.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "heznpc"
          git config user.email "heznpc@users.noreply.github.com"
          git add docs/kcu-schedule.ics docs/kcu-schedule.json
          git commit -m "chore: update KCU academic calendar"
          git push
